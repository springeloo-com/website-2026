# CloudCannon configuration — Springeloo corporate site
# Editors edit structured YAML only (no Bookshop / page builder).
# Publishing: content branch → PR → maintainer merges to main → GitHub Pages.

# Prefer pull-request publishing so editor saves never land on main directly.
# Exact UI for branching is also set in the CloudCannon dashboard (see docs/howto-cloudcannon.md).
source: .
paths:
  uploads: public/uploads
  static: public
  data: src/content

collections_config:
  globals:
    path: src/content/site
    glob:
      - globals.yaml
    name: Site globals
    icon: settings
    disable_add: true
    disable_add_folder: true
    disable_file_actions: true
    _enabled_editors:
      - data
    schemas:
      default:
        path: src/content/site/globals.yaml
    _inputs:
      brandName:
        type: text
        comment: Brand name in the header/footer mark
      nav:
        type: array
        label: Primary navigation
        options:
          preview:
            text:
              - key: label
          max_items: 4
          min_items: 4
          disable_add: true
          disable_remove: true
          disable_reorder: true
      nav[*].id:
        type: hidden
      nav[*].href:
        type: hidden
        comment: Developer-controlled — not editable by content editors
      nav[*].label:
        type: text
        label: Nav label
      nav[*].children:
        type: array
        options:
          disable_add: true
          disable_remove: true
          disable_reorder: true
      nav[*].children[*].href:
        type: hidden
      nav[*].children[*].label:
        type: text
      footer.tagline:
        type: text
      footer.company:
        type: text
      footer.addressLines:
        type: array
        options:
          empty_type: string
      footer.phone:
        type: text
      footer.email:
        type: email
      footer.linkedIn:
        type: hidden
        comment: Developer-controlled social URL
      footer.legal:
        type: array
        options:
          disable_add: true
          disable_remove: true
          disable_reorder: true
      footer.legal[*].href:
        type: hidden
      footer.legal[*].label:
        type: text
      contact.addressLines:
        type: array
        options:
          empty_type: string
      contact.phone:
        type: text
      contact.email:
        type: email

  home:
    path: src/content/pages
    glob:
      - home.yaml
    name: Home page
    icon: home
    disable_add: true
    disable_add_folder: true
    disable_file_actions: true
    _enabled_editors:
      - data
    schemas:
      default:
        path: src/content/pages/home.yaml
    _inputs:
      meta.title:
        type: text
        label: SEO title
      meta.description:
        type: textarea
        label: SEO description
      hero.eyebrow:
        type: text
      hero.headline:
        type: text
      hero.badge:
        type: text
      hero.image.src:
        type: image
        label: Hero image
        options:
          path: public/uploads
      hero.image.alt:
        type: text
        label: Hero image alt text
      hero.primaryCta.label:
        type: text
        label: Primary CTA label
      hero.primaryCta.href:
        type: hidden
        comment: Developer-controlled destination
      hero.secondaryCta.label:
        type: text
        label: Secondary CTA label
      hero.secondaryCta.href:
        type: hidden
        comment: Developer-controlled destination
      leistungen.cards:
        type: array
        label: Leistungen cards
        comment: Exactly three fixed cards — add/remove disabled
        options:
          preview:
            text:
              - key: title
          max_items: 3
          min_items: 3
          disable_add: true
          disable_remove: true
          disable_reorder: true
      leistungen.cards[*].eyebrow:
        type: text
      leistungen.cards[*].title:
        type: text
      leistungen.cards[*].body:
        type: markdown
        label: Card body (Markdown)
        comment: Lists and headings allowed; styles come from the site CSS only
      leistungen.cards[*].image.src:
        type: image
        label: Card image (optional)
        options:
          path: public/uploads
      leistungen.cards[*].image.alt:
        type: text
        label: Card image alt
      leistungen.cards[*].cta.label:
        type: text
        label: Card CTA label
      leistungen.cards[*].cta.href:
        type: hidden
        comment: Developer-controlled destination

# Data files (non-collection) — keep empty; we use collections above
data_config: false

# Do not enable Bookshop / visual page building for v1
_editables: {}

# Notes for maintainers configuring the CloudCannon site dashboard:
# - Set publishing / branching to a content branch with PR into main
# - Editor role: edit content collections only; no merge to main
# - Maintainer role: merge PRs; manage this config
# See docs/howto-cloudcannon.md
