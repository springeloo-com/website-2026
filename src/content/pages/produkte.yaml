products:
  - id: spring-ida2
    category: Identity Management
    name: spring id.a2
    logo:
      src: /uploads/produkte/ida-logo.png
      alt: spring id.a2 Logo
    mock:
      src: /uploads/product ida2 infographic.png
      alt: spring id.a2 Oberfläche auf Tablet
    features:
      - title: 'Sichere Authentifizierung:'
        body: Höchster Schutz durch Multi-Faktor-Authentifizierung (MFA). Nutzer loggen sich sicher und flexibel via ID Austria, Passkey, SMS-OTP oder Authenticator-Apps ein – für maximale IT-Sicherheit.
      - title: 'Self-Service-Portal:'
        body: Entlastung für Ihre IT. Mitarbeiter und Kunden verwalten Passwörter, Stammdaten und Verifizierungen im intuitiven Web-Portal selbst. Das senkt die Ticket-Rate im Support spürbar.
      - title: 'Flexibles Deployment:'
        body: Sie entscheiden, wo Ihre Daten liegen. Die Software läuft wahlweise hochverfügbar in Ihrer Cloud (Cloud-Native) oder klassisch On-Premise auf Ihren eigenen Servern vor Ort.
    summary: spring id.a2  bietet sicheres, Keycloak-basiertes Identity & Access Management. Mit Self-Service-Portal und Support-Dashboard sorgt die Lösung für eine verlässliche, skalierbare und NIS2-konforme Zugriffssteuerung aller User.
    details:
      - title: 'Keine Lizenzkosten:'
        body: Volle Budgetkontrolle ohne Vendor-Lock-in. Da die Lösung auf dem Open-Source-Standard Keycloak basiert, entfallen teure, wiederkehrende Lizenzgebühren für Nutzer oder Features.
        image:
          src: /uploads/keycloak_logo.png
          alt: Touchpoint Management Oberfläche
      - title: 'NIS2 & Compliance-konform:'
        body: Rechtssicher agieren. spring id.a2 deckt alle gängigen regulatorischen Standards ab und liefert lückenlose Audits und Protokolle, die für Audits zwingend erforderlich sind.
        image:
          src: /uploads/istockphoto-2247127726-612x612.jpg
          alt: Kundenservice-Tools und Support-Dashboard
      - title: 'White-Label & Customizing:'
        body: Nahtlose Markenidentität. Das gesamte System – vom Login-Bildschirm bis zur Bestätigungs-E-Mail – wird exakt an das Corporate Design Ihres Unternehmens angepasst.
        image:
          src: /uploads/istockphoto-1504880863-612x612.jpg
          alt: Nahtlose Migration von Bestandsdaten
  - id: spring-suitecrm
    category: Die kollaborative Arbeitsplattform mit integrierter KI
    name: Limespace
    logo: null
    mock:
      src: /uploads/Limespace_Module.png
      alt: Limespace Dashboard auf Tablet
    features:
      - title: Alles verbunden – statt isolierter Einzellösungen
        body: CRM, Projekte, Aufgaben, Dokumente, Termine, Zeiten, Reporting und weitere Geschäftsprozesse greifen auf eine gemeinsame Datenbasis zu und können miteinander verknüpft werden.
      - title: 'Limespace versteht Zusammenarbeit weiter:'
        body: |-
          Als Zusammenspiel von Menschen, Teams und künstlicher Intelligenz.
          Die integrierte KI agiert nicht nur als Chatbot oder Textgenerator, sondern als intelligenter digitaler Kollege innerhalb der Arbeitsumgebung. Sie arbeitet innerhalb derselben Arbeitsumgebung, kennt den verfügbaren Kontext und kann Informationen zusammenführen, Zusammenhänge erkennen und bei der weiteren Arbeit mitdenken.
      - title: Die Software passt sich dem Unternehmen an – nicht umgekehrt
        body: |-
          Limespace gibt keine starren Prozesse vor. Workflows, Formulare, Datenstrukturen, Felder, Ansichten und Abläufe können an die individuellen Anforderungen eines Unternehmens oder einer Organisation angepasst werden.
          Bestehende Prozesse lassen sich damit ebenso abbilden wie neue Arbeitsweisen entwickeln und automatisieren.
    summary: Limespace unterstützt überall dort, wo Menschen, Informationen, Termine, Aufgaben und Prozesse zusammenkommen. Limespace schafft eine gemeinsame Arbeitsumgebung, die sich an den jeweiligen Bedarf anpasst.
    details:
      - title: Alles verbunden – statt isolierter Einzellösungen
        body: |-
          CRM, Projekte, Aufgaben, Dokumente, Termine, Zeiten, Reporting und weitere Geschäftsprozesse greifen auf eine gemeinsame Datenbasis zu und können miteinander verknüpft werden.
          Informationen stehen dadurch dort zur Verfügung, wo sie gebraucht werden – ohne Medienbrüche, redundante Datenhaltung oder manuelle Übertragung zwischen unterschiedlichen Systemen.
          So entsteht ein gemeinsamer Arbeitskontext für Mitarbeiter, Teams und KI.
        image:
          src: /uploads/istockphoto-1643825903-612x612.jpg
          alt: Kontakt Management in SuiteCRM
      - title: Zusammenarbeit zwischen Menschen und KI – der intelligente Kollege
        body: |-
          Limespace versteht Zusammenarbeit weiter: als Zusammenspiel von Menschen, Teams und künstlicher Intelligenz.
          Die integrierte KI agiert nicht nur als Chatbot oder Textgenerator, sondern als intelligenter digitaler Kollege innerhalb der Arbeitsumgebung. Sie arbeitet innerhalb derselben Arbeitsumgebung, kennt den verfügbaren Kontext und kann Informationen zusammenführen, Zusammenhänge erkennen und bei der weiteren Arbeit mitdenken. 
          Sie kann Informationen über verschiedene Bereiche hinweg finden und einordnen, Berichte erstellen, Dokumente verarbeiten, Aufgaben und Projekte anlegen, Workflows auslösen und bei administrativen sowie analytischen Tätigkeiten unterstützen.
          Die KI unterstützt damit wie ein Kollege, der den Vorgang bereits kennt und nicht jedes Mal neu eingearbeitet werden muss. 
          Dabei kann die Interaktion ganz natürlich per Sprache erfolgen. Informationen abfragen, Notizen erfassen, Aufgaben anlegen oder Arbeitsabläufe anstoßen – viele Tätigkeiten können direkt über Sprache gesteuert werden.
        image:
          src: /uploads/istockphoto-2188968497-612x612.jpg
          alt: Collaborative Tools im CRM
      - title: Datenhoheit, Kontrolle und Datenschutz
        body: |-
          Unternehmensdaten sind ein zentraler Unternehmenswert. Limespace ist deshalb darauf ausgelegt, die Kontrolle über Daten und technologische Abhängigkeiten beim Unternehmen zu belassen. 
          Durch flexible Betriebsmodelle, offene Schnittstellen und die Möglichkeit, unterschiedliche KI-Modelle einzusetzen, wird die Abhängigkeit von einzelnen Technologieanbietern reduziert. Unternehmen können neue Technologien nutzen und weiterentwickeln, ohne ihre Daten und Prozesse dauerhaft an einen einzelnen Anbieter zu binden.
          Damit verbindet Limespace Datenschutz und Datenhoheit mit einem strategischen Vorteil: mehr technologische Unabhängigkeit und weniger Vendor Lock-in.
        image:
          src: /uploads/istockphoto-1180599068-612x612.jpg
          alt: Mobile Adaption des CRM
  - id: host-abloese
    category: Host Ablöse
    name: Host Ablöse
    logo: null
    mock:
      src: /uploads/product legacy_decommissioning2 gemini.png
      alt: Host Ablöse Modernisierungsoberfläche
    features:
      - title: 'DORA- & Compliance-Schutz:'
        body: Revisionssichere Prozesse. Durch lückenlose Provenienz entsteht ein fälschungssicherer Audit-Log für die Banken- und Versicherungsaufsicht.
      - title: 'Re-Engineering von Fachwissen:'
        body: Schutz vor Know-how-Verlust. Historisches, implizites Wissen wird aus altem Code extrahiert und in lesbare Fachlogik übersetzt.
      - title: 'Echte Microservices:'
        body: Nachhaltige Architektur. Agenten-Frameworks erkennen Kopplungen und schlagen modulare Grenzen vor – kein neuer „Java-Mainframe“.
    summary: Mittels Spec-Driven Development (SDD) und KI-Agenten wird Legacy-Code in modulare Microservices transformiert. Wir schaffen ein sicheres Fundament für Ihre IT-Transformation – fachlich absolut gleichwertig, performant und nachhaltig wartbar.
    details:
      - title: 'Spec-Driven Code Gen:'
        body: Vollautomatisierte oder KI-gestützte Übersetzung. KI-Agenten analysieren den alten Legacy-Code, erstellen präzise Fachspezifikationen und generieren daraus sauberen, modernen Java-Code.
        image:
          src: /uploads/istockphoto-2283287180-612x612.jpg
          alt: Spec-Driven Code Gen
      - title: 'Automated Test-Suite:'
        body: Höchste Qualität ab Tag eins. Aus den generierten Spezifikationen erzeugt das System vollautomatisch umfassende Unit-, Integrations- und Regressionstests (JUnit 5, Cypress).
        image:
          src: /uploads/istockphoto-2286464404-612x612.jpg
          alt: Automated Test-Suite
      - title: 'Equivalence Validation:'
        body: Risikofreier Parallelbetrieb. Ein spezialisierter Diff-Agent führt automatisierte Massendaten- und Checksummen-Abgleiche durch, um die 1:1-Gleichwertigkeit mathematisch zu beweisen.
        image:
          src: /uploads/istockphoto-1643825903-612x612.jpg
          alt: Equivalence Validation
  - id: patho-ki
    category: 'Praxis-Showcase: KI-Assistenzsystem in der digitalen Pathologie (Labor Dr. Ulm)'
    name: Souveräne KI-Lösungen
    logo: null
    mock:
      src: /uploads/heatmap_klein.png
      alt: Souveräne KI-Lösungen entwickeln
    features:
      - title: 'Souveräne KI für Fachärzte:'
        body: Eine souveräne KI bedeutet volles Eigentum an Modellen, Quellcodes und Daten, lückenlose Transparenz sowie die Freiheit, Systeme flexibel an spezifische Domänenanforderungen anzupassen – ohne Vendor-Lock-in. Die springeloo GmbH begleitet Sie von der ersten Modellkonzeption über das MLOps-Engineering bis hin zum regulatorisch abgesicherten Echbetrieb.
      - title: Domänenspezifisches KI-Modell-Engineering
        body: 'Maßgeschneiderte Modellarchitekturen: Wir entwickeln individuelle Deep-Learning-Architekturen (z. B. auf Basis von ConvNeXt/ResNet), die exakt auf Ihre Fachdomäne zugeschnitten sind – von binären Entscheidungen bis hin zu hochgranularen Mehrklassensystemen.'
      - title: Data Engineering & Kuratierung
        body: |-
          Über automatisierte Ranking-Verfahren identifizieren wir gezielt jene Datenpunkte, die den höchsten Informationsgehalt für das Modell aufweisen, um Datensätze hocheffizient und qualitativ präzise zu erweitern.
          Ihre Trainingsdaten verbleiben zu 100 % in Ihrem Eigentum. Wir etablieren Prozesse, die Datenschutz und Anonymisierung nativ in der Daten-Pipeline verankern.
    summary: |-
      Ihre eigene, unabhängige Künstliche Intelligenz – passgenau, reguliert und voll unter Ihrer Kontrolle.
      Unternehmen stehen heute vor der Entscheidung: Abhängigkeit von proprietären Drittanbieter-Blackboxes oder der Aufbau einer eigenen, souveränen KI-Architektur. Erfahren Sie mehr über unsere Leistungen am Bespiel des Praxis-Showcase: KI-Assistenzsystem in der digitalen Pathologie (Labor Dr. Ulm)
    details:
      - title: Ausgangslage
        body: Steigende Probenzahlen und Fachkräftemangel in der Histopathologie erforderten eine automatisierte Vor-Priorisierung unauffälliger Routinefälle, um Fachärzt:innen zu entlasten.
        image:
          src: /uploads/produkte/carousel/product-1.png
          alt: Bildanalyse und Mustererkennung
      - title: Umsetzung durch springeloo
        body: |-
          Mehrklassen-KI:  Umstellung von einfachen Zweiklassensystemen auf ein granulare Mehrklassen-Modell zur Präzisionsunterscheidung spezifischer Gewebepathologien (wie Polypenarten und Entzündungen im GI-Trakt).

          Anomalieerkennung:  Mathematische Absicherung von Seltenheiten und Artefakten via Mahalanobis-Distanz.

          Schatten-Inferenz & Orchestrator:  Entwicklung eines zentralen Orchestrator-Services, der WSI-Scans im Netzwerk automatisiert erfasst und Vorbefund-Textbausteine sowie Priorisierungs-Flags per REST-API und HL7/FHIR direkt im bestehenden Laborinformationssystem (LIS) bereitstellt.

          AI Act & MLOps:  Vollständige Code- und Modellversionierung, manuelle Feedback-Schleifen der Patholog:innen zur Qualitätskontrolle sowie Erfüllung der Transparenz- und Logging-Auflagen nach dem EU AI Act.
        image:
          src: /uploads/produkte/carousel/product-2.png
          alt: Erklärbare KI-Hinweise
      - title: Ergebnis
        body: Eine souveräne, betriebsbereite KI-Lösung, die Durchlaufzeiten bei Routinefällen um 65–75 % senkt, die ärztliche Entscheidungssicherheit stärkt und dem Labor die vollständige Kontrolle über die eigene Technologie sichert.
        image:
          src: /uploads/produkte/intro-b.png
          alt: Klinische Integration
