                fields:
                  - { label: Id (developer), name: id, widget: hidden }
                  - { label: Name, name: name, widget: string }
                  - label: Description lines
                    name: description
                    widget: list
                    allow_add: true
                    field: { label: Line, name: line, widget: string }
                  - label: Image
                    name: image
                    widget: object
                    fields:
