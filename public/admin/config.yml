                      - { label: Alt text, name: alt, widget: string }
          - label: Products (exactly three)
            name: products
            widget: list
            allow_add: false
            collapsed: true
            summary: '{{fields.name}}'
            min: 3
            max: 3
            fields:
              - { label: Id (developer), name: id, widget: hidden }
              - { label: Category, name: category, widget: string }
              - { label: Name, name: name, widget: string }
              - label: Logo (optional)
                name: logo
                widget: object
                required: false
                fields:
                  - { label: File, name: src, widget: image, required: false }
                  - { label: Alt text, name: alt, widget: string, required: false }
              - label: Mock image
                name: mock
                widget: object
                fields:
                  - { label: File, name: src, widget: image }
                  - { label: Alt text, name: alt, widget: string }
              - label: Features
                name: features
                widget: list
                collapsed: true
                summary: '{{fields.title}}'
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Body, name: body, widget: text }
              - { label: Summary, name: summary, widget: text }
              - label: Details
                name: details
                widget: list
